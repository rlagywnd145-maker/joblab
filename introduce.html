<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1분 자기소개 만들기 | 취업연구소</title>
<meta name="description" content="지원 직무와 경험, 강점을 입력하면 면접용 1분 자기소개 초안을 무료로 만들어드립니다.">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f7f9fc;
  color:#172033;
  line-height:1.7;
}

a{text-decoration:none;color:inherit}
button,input,textarea,select{font:inherit}

.container{
  width:min(900px,calc(100% - 36px));
  margin:auto;
}

header{
  background:rgba(255,255,255,.96);
  border-bottom:1px solid #e8edf5;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#2563eb;
  font-size:21px;
  font-weight:800;
}

.logo-icon{
  width:35px;
  height:35px;
  border-radius:11px;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

.home{
  color:#687386;
  font-size:14px;
  font-weight:700;
}

.page-head{
  padding:65px 0 35px;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  background:#eff6ff;
  color:#2563eb;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  margin-bottom:14px;
}

h1{
  font-size:38px;
  letter-spacing:-1.5px;
  margin-bottom:10px;
}

.page-head p{color:#748095}

.tool-box,.result-box{
  background:white;
  border:1px solid #e3e9f2;
  border-radius:24px;
  padding:32px;
  box-shadow:0 14px 40px rgba(36,55,84,.07);
}

.tool-box{margin-bottom:25px}
.form-group{margin-bottom:23px}

label{
  display:block;
  font-weight:800;
  font-size:14px;
  margin-bottom:9px;
}

input,textarea,select{
  width:100%;
  border:1px solid #dce3ed;
  background:#fbfcfe;
  border-radius:12px;
  padding:14px 15px;
  outline:none;
}

textarea{
  resize:vertical;
  min-height:115px;
}

input:focus,textarea:focus,select:focus{
  border-color:#2563eb;
  background:white;
  box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

.help{
  display:block;
  margin-top:6px;
  color:#929bad;
  font-size:12px;
}

.generate{
  width:100%;
  border:0;
  border-radius:13px;
  padding:16px;
  background:#2563eb;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.generate:hover{background:#1d4ed8}

.result-box{
  display:none;
  margin-bottom:25px;
}

.result-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.result-head h2{font-size:21px}

.complete{
  background:#ecfdf5;
  color:#059669;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.result{
  background:#f8fafc;
  border-radius:15px;
  padding:22px;
  white-space:pre-wrap;
  color:#364153;
}

.time-info{
  margin-top:13px;
  padding:12px 15px;
  border-radius:11px;
  background:#fff7ed;
  color:#9a5b16;
  font-size:12px;
}

.copy{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:1px solid #dbe3ee;
  background:white;
  border-radius:11px;
  font-weight:800;
  cursor:pointer;
  color:#475569;
}

.notice{
  background:#eff6ff;
  padding:18px 20px;
  border-radius:15px;
  color:#53627a;
  font-size:13px;
  margin-bottom:60px;
}

.notice strong{color:#2563eb}

footer{
  background:#0b1120;
  color:#8d98aa;
  padding:38px 0;
  font-size:13px;
}

footer strong{
  display:block;
  color:white;
}

@media(max-width:600px){
  .page-head{padding-top:45px}
  h1{font-size:31px}
  .tool-box,.result-box{padding:21px}
}
</style>
</head>

<body>

<header>
<div class="container header-inner">

<a href="index.html" class="logo">
<div class="logo-icon">💼</div>
취업연구소
</a>

<a href="index.html" class="home">← 메인으로</a>

</div>
</header>


<main class="container">

<div class="page-head">

<div class="badge">FREE JOB TOOL</div>

<h1>1분 자기소개 만들기</h1>

<p>
면접에서 사용할 경험과 강점을 입력하면 자연스러운 자기소개 초안을 만들어드립니다.
</p>

</div>


<div class="tool-box">

<div class="form-group">

<label for="job">지원 직무</label>

<input
type="text"
id="job"
placeholder="예: 홀 서비스, 사무직, 마케팅">

</div>


<div class="form-group">

<label for="career">지원 유형</label>

<select id="career">
<option value="신입">신입</option>
<option value="경력">경력</option>
<option value="아르바이트">아르바이트</option>
</select>

</div>


<div class="form-group">

<label for="strength">나의 가장 큰 강점</label>

<input
type="text"
id="strength"
placeholder="예: 책임감, 고객응대, 빠른 상황 판단">

</div>


<div class="form-group">

<label for="experience">강점을 보여주는 경험</label>

<textarea
id="experience"
placeholder="예: 음식점에서 근무하며 고객 응대와 매장 운영을 담당했고 바쁜 시간에도 침착하게 업무를 처리했습니다."></textarea>

<span class="help">
면접관에게 가장 보여주고 싶은 경험 하나를 적어주세요.
</span>

</div>


<div class="form-group">

<label for="goal">입사 후 목표</label>

<textarea
id="goal"
placeholder="예: 빠르게 업무를 익혀 고객 만족과 원활한 매장 운영에 기여하고 싶습니다."></textarea>

</div>


<button class="generate" onclick="generateIntro()">
1분 자기소개 만들기 →
</button>

</div>


<div class="result-box" id="resultBox">

<div class="result-head">
<h2>1분 자기소개 초안</h2>
<div class="complete">완성</div>
</div>

<div class="result" id="result"></div>

<div class="time-info">
💡 실제 면접에서는 문장을 그대로 외우기보다 핵심 내용만 기억하고 자연스럽게 말해보세요.
</div>

<button class="copy" onclick="copyResult()">
결과 복사하기
</button>

</div>


<div class="notice">
<strong>TIP.</strong>
1분 자기소개는 모든 경력을 설명하기보다
<strong>강점 → 경험 → 직무 연결 → 입사 후 목표</strong> 순서로 준비하면 훨씬 깔끔합니다.
</div>

</main>


<footer>
<div class="container">
<strong>취업연구소</strong>
취업 준비를 조금 더 쉽고 간단하게.
</div>
</footer>


<script>

function generateIntro(){

  const job =
    document.getElementById("job").value.trim();

  const career =
    document.getElementById("career").value;

  const strength =
    document.getElementById("strength").value.trim();

  const experience =
    document.getElementById("experience").value.trim();

  const goal =
    document.getElementById("goal").value.trim();


  if(!job){
    alert("지원 직무를 입력해주세요.");
    return;
  }

  if(!strength){
    alert("나의 강점을 입력해주세요.");
    return;
  }

  if(!experience){
    alert("강점을 보여주는 경험을 입력해주세요.");
    return;
  }


  const text =
`안녕하세요. ${job} 직무에 지원한 ${career} 지원자입니다.

저의 강점은 ${strength}입니다. ${experience}

이러한 경험을 통해 맡은 역할에 책임감을 가지고 상황에 맞게 대응하는 방법을 배웠으며, 제가 가진 강점을 ${job} 업무에서도 적극적으로 활용하고 싶습니다.

${goal ? goal : `입사 후에는 업무를 빠르게 익히고 꾸준히 성장하며 조직에 도움이 되는 구성원이 되겠습니다.`}

감사합니다.`;


  document.getElementById("result").textContent = text;

  const box =
    document.getElementById("resultBox");

  box.style.display = "block";

  box.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


function copyResult(){

  const text =
    document.getElementById("result").innerText;

  navigator.clipboard.writeText(text)
  .then(()=>{
    alert("1분 자기소개가 복사되었습니다.");
  })
  .catch(()=>{
    alert("복사에 실패했습니다. 직접 선택해서 복사해주세요.");
  });

}

</script>

</body>
</html>
