<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 지원동기 개선 | 취업연구소</title>
<meta name="description" content="AI를 활용해 지원동기의 흐름과 표현을 개선해보세요.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f6f8fc;
  color:#111827;
  line-height:1.7;
}

a{
  text-decoration:none;
  color:inherit;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#2563eb;
}

.back{
  color:#64748b;
  font-size:14px;
  font-weight:700;
}

main{
  max-width:900px;
  margin:auto;
  padding:55px 20px 90px;
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title h1{
  font-size:32px;
  margin-bottom:8px;
}

.title p{
  color:#64748b;
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:22px;
  padding:32px;
  box-shadow:0 12px 35px rgba(15,23,42,.06);
}

label{
  display:block;
  font-weight:800;
  font-size:14px;
  margin-bottom:8px;
}

.form-group{
  margin-bottom:20px;
}

select,
input,
textarea{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:11px;
  outline:none;
  font:inherit;
}

select,
input{
  height:48px;
  padding:0 13px;
}

textarea{
  min-height:240px;
  padding:15px;
  resize:vertical;
}

select:focus,
input:focus,
textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

.info{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  color:#94a3b8;
  font-size:12px;
}

button{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:15px;
  border-radius:11px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.result{
  display:none;
  margin-top:25px;
  padding:24px;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:14px;
}

.result.show{
  display:block;
}

.result h3{
  margin-bottom:14px;
}

.result-content{
  white-space:pre-wrap;
  color:#334155;
}

.notice{
  margin-top:18px;
  padding:14px;
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:10px;
  font-size:13px;
}

footer{
  text-align:center;
  padding:35px 20px;
  color:#94a3b8;
  font-size:13px;
}

@media(max-width:650px){
  main{
    padding:35px 14px 60px;
  }

  .card{
    padding:22px 18px;
  }

  .title h1{
    font-size:27px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="./index.html" class="logo">
      💼 취업연구소
    </a>

    <a href="./ai-pro.html" class="back">
      ← AI Pro
    </a>

  </div>
</header>


<main>

  <div class="title">
    <h1>🎯 AI 지원동기 개선</h1>
    <p>
      작성한 지원동기를 AI가 분석하고
      더 자연스럽고 설득력 있는 방향을 제안합니다.
    </p>
  </div>


  <div class="card">

    <div class="form-group">

      <label for="job">
        지원 직무
      </label>

      <select id="job">
        <option value="">
          직무를 선택해주세요
        </option>

        <option>서비스·고객응대</option>
        <option>사무·경영지원</option>
        <option>영업·마케팅</option>
        <option>IT·개발</option>
        <option>디자인</option>
        <option>생산·기술</option>
        <option>물류·유통</option>
        <option>기타</option>
      </select>

    </div>


    <div class="form-group">

      <label for="company">
        지원 회사
      </label>

      <input
        id="company"
        type="text"
        maxlength="100"
        placeholder="예: OO기업 (선택사항)"
      >

    </div>


    <div class="form-group">

      <label for="essay">
        지원동기 내용
      </label>

      <textarea
        id="essay"
        maxlength="5000"
        placeholder="작성한 지원동기를 입력해주세요."
      ></textarea>

      <div class="info">
        <span>
          개인정보는 입력하지 않는 것을 권장합니다.
        </span>

        <span id="counter">
          0 / 5,000
        </span>
      </div>

    </div>


    <button
      type="button"
      id="analyzeButton"
    >
      🎯 AI로 지원동기 개선하기
    </button>


    <div
      class="result"
      id="result"
    >

      <h3>
        AI 개선 결과
      </h3>

      <div
        class="result-content"
        id="resultContent"
      ></div>

    </div>


    <div class="notice">
      💡 AI가 없는 경험이나 사실을 임의로 만들어내지 않도록
      실제 경험을 중심으로 내용을 작성해주세요.
    </div>

  </div>

</main>


<footer>
  © 2026 취업연구소. All rights reserved.
</footer>


<script>

const API_URL =
  "https://joblab-ai.rlagywnd145.workers.dev/";

const essay =
  document.getElementById("essay");

const counter =
  document.getElementById("counter");

const button =
  document.getElementById("analyzeButton");

const result =
  document.getElementById("result");

const resultContent =
  document.getElementById("resultContent");


function updateCounter(){

  counter.textContent =
    essay.value.length.toLocaleString()
    + " / 5,000";

}

essay.addEventListener(
  "input",
  updateCounter
);

updateCounter();


button.addEventListener(
  "click",
  async function(){

    const job =
      document.getElementById("job").value;

    const company =
      document.getElementById("company").value.trim();

    const text =
      essay.value.trim();


    if(!job){

      alert(
        "지원 직무를 선택해주세요."
      );

      return;
    }


    if(text.length < 30){

      alert(
        "지원동기를 30자 이상 입력해주세요."
      );

      return;
    }


    button.disabled = true;

    button.textContent =
      "🎯 AI가 지원동기를 분석하고 있습니다...";


    result.classList.add("show");

    resultContent.textContent =
      "지원동기를 분석하고 있습니다.\n잠시만 기다려주세요.";


    try{

      const requestText =
`[지원동기 개선 요청]

지원 회사:
${company || "회사명 미입력"}

현재 작성한 지원동기:
${text}

위 내용을 지원동기 관점에서 분석해주세요.

반드시 다음 원칙을 지켜주세요.

1. 사용자가 작성하지 않은 경력, 경험, 성과, 자격증, 수치 또는 사실을 만들어내지 마세요.
2. 없는 경험을 추가하지 마세요.
3. 현재 내용에서 부족한 정보는 사실처럼 채우지 말고 어떤 내용을 추가하면 좋은지 질문이나 제안 형태로 알려주세요.
4. 지원 직무와의 연결성을 분석해주세요.
5. 지원동기의 흐름과 설득력을 개선해주세요.
6. 어색하거나 추상적인 표현을 구체적으로 지적해주세요.
7. 마지막에 사용자가 실제 사실을 바탕으로 수정할 수 있는 개선 예시를 제공해주세요.

결과는 다음 순서로 작성해주세요.

[전체 평가]

[좋은 점]

[개선할 점]

[직무 연결성]

[추가하면 좋은 내용]

[개선 예시]`;


      const response =
        await fetch(
          API_URL,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              job:job,
              essay:requestText
            })
          }
        );


      const data =
        await response.json();


      if(
        response.status === 429 &&
        data.limitReached
      ){

        resultContent.textContent =
          "오늘의 무료 AI 이용 3회를 모두 사용했습니다.\n내일 다시 이용해주세요.";

        button.disabled = false;

        button.textContent =
          "오늘 무료 이용 완료";

        return;
      }


      if(
        !response.ok ||
        !data.ok
      ){

        throw new Error(
          data.error ||
          "AI 분석 중 오류가 발생했습니다."
        );
      }


      resultContent.textContent =
        data.result;


      const remaining =
        Number(
          data.usage?.remaining ?? 0
        );


      const usage =
        document.createElement("div");

      usage.style.marginTop =
        "22px";

      usage.style.padding =
        "12px";

      usage.style.background =
        "#eff6ff";

      usage.style.color =
        "#2563eb";

      usage.style.borderRadius =
        "10px";

      usage.style.textAlign =
        "center";

      usage.style.fontSize =
        "13px";

      usage.style.fontWeight =
        "800";


      if(remaining > 0){

        usage.textContent =
          `오늘 무료 AI 이용 · ${remaining}회 남음`;

        button.disabled = false;

        button.textContent =
          `🎯 AI로 지원동기 개선하기 · ${remaining}회 남음`;

      }else{

        usage.textContent =
          "오늘 무료 AI 이용 3 / 3회 · 무료 이용 완료";

        button.disabled = false;

        button.textContent =
          "오늘 무료 이용 완료";
      }


      resultContent.appendChild(
        usage
      );


    }catch(error){

      resultContent.textContent =
        "AI 분석 중 문제가 발생했습니다.\n\n"
        + error.message;

      button.disabled = false;

      button.textContent =
        "🎯 AI로 지원동기 개선하기";

    }


    result.scrollIntoView({
      behavior:"smooth",
      block:"nearest"
    });

  }
);

</script>

</body>
</html>
