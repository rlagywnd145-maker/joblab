<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 이력서 문장 개선 | 취업연구소</title>
<meta name="description" content="이력서에 작성한 경력, 경험, 업무 내용을 AI가 분석하고 더 명확하고 자연스러운 문장으로 개선합니다.">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f6f8fc;
  color:#111827;
  line-height:1.7;
}

a{text-decoration:none;color:inherit}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#2563eb;
}

.back{
  color:#64748b;
  font-size:14px;
  font-weight:700;
}

main{
  max-width:900px;
  margin:auto;
  padding:55px 20px 90px;
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title h1{
  font-size:32px;
  margin-bottom:8px;
}

.title p{
  color:#64748b;
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:22px;
  padding:32px;
  box-shadow:0 12px 35px rgba(15,23,42,.06);
}

.form-group{
  margin-bottom:20px;
}

label{
  display:block;
  font-size:14px;
  font-weight:800;
  margin-bottom:8px;
}

select,
input,
textarea{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:11px;
  background:#fff;
  outline:none;
  font:inherit;
}

select,
input{
  height:48px;
  padding:0 13px;
}

textarea{
  min-height:240px;
  padding:15px;
  resize:vertical;
}

select:focus,
input:focus,
textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

.info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:7px;
  color:#94a3b8;
  font-size:12px;
}

button{
  width:100%;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:15px;
  border-radius:11px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

button:hover{background:#1d4ed8}

button:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.result{
  display:none;
  margin-top:25px;
  padding:24px;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:14px;
}

.result.show{display:block}

.result h3{
  font-size:18px;
  margin-bottom:14px;
}

.result-content{
  white-space:pre-wrap;
  color:#334155;
  font-size:15px;
}

.notice{
  margin-top:18px;
  padding:14px;
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:10px;
  font-size:13px;
}

footer{
  text-align:center;
  padding:35px 20px;
  color:#94a3b8;
  font-size:13px;
}

@media(max-width:650px){
  main{padding:35px 14px 60px}
  .card{padding:22px 18px}
  .title h1{font-size:27px}
  .info{flex-direction:column}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="./index.html" class="logo">
      💼 취업연구소
    </a>

    <a href="./ai-pro.html" class="back">
      ← AI Pro
    </a>
  </div>
</header>

<main>

  <div class="title">
    <h1>📄 AI 이력서 문장 개선</h1>
    <p>
      이력서에 작성한 경험이나 업무 내용을 입력하면<br>
      AI가 더 명확하고 자연스러운 문장으로 개선합니다.
    </p>
  </div>

  <div class="card">

    <div class="form-group">
      <label for="job">지원 직무</label>

      <select id="job">
        <option value="">직무를 선택해주세요</option>
        <option>서비스·고객응대</option>
        <option>사무·경영지원</option>
        <option>영업·마케팅</option>
        <option>IT·개발</option>
        <option>디자인</option>
        <option>생산·기술</option>
        <option>물류·유통</option>
        <option>기타</option>
      </select>
    </div>

    <div class="form-group">
      <label for="section">개선할 항목</label>

      <select id="section">
        <option value="">항목을 선택해주세요</option>
        <option>경력사항</option>
        <option>담당업무</option>
        <option>프로젝트 경험</option>
        <option>아르바이트 경험</option>
        <option>성과 및 실적</option>
        <option>기타 경험</option>
      </select>
    </div>

    <div class="form-group">
      <label for="essay">현재 이력서 문장</label>

      <textarea
        id="essay"
        maxlength="5000"
        placeholder="예: 음식점에서 홀 업무를 담당했고 고객 응대와 매장 정리, 주문 접수 등의 업무를 했습니다."
      ></textarea>

      <div class="info">
        <span>실제로 경험한 내용만 입력해주세요.</span>
        <span id="counter">0 / 5,000</span>
      </div>
    </div>

    <button type="button" id="analyzeButton">
      📄 AI로 이력서 문장 개선하기
    </button>

    <div class="result" id="result">
      <h3>AI 이력서 분석 결과</h3>
      <div class="result-content" id="resultContent"></div>
    </div>

    <div class="notice">
      🔒 입력하지 않은 경력·성과·자격증·수치 등을 사실처럼 추가하지 않도록 AI에 요청합니다.
      중요한 내용은 제출 전에 반드시 직접 확인해주세요.
    </div>

  </div>

</main>

<footer>
  © 2026 취업연구소. All rights reserved.
</footer>

<script>
const API_URL =
  "https://joblab-ai.rlagywnd145.workers.dev/";

const essay = document.getElementById("essay");
const counter = document.getElementById("counter");
const button = document.getElementById("analyzeButton");
const result = document.getElementById("result");
const resultContent = document.getElementById("resultContent");

let limitReached = false;


/* 글자 수 */

function updateCounter(){
  counter.textContent =
    essay.value.length.toLocaleString() + " / 5,000";
}

essay.addEventListener("input", updateCounter);
essay.addEventListener("keyup", updateCounter);
essay.addEventListener("paste", function(){
  setTimeout(updateCounter,0);
});

updateCounter();


/* 오늘 무료 사용량 확인 */

async function loadUsage(){

  try{

    const response = await fetch(API_URL);
    const data = await response.json();

    if(!response.ok || !data.ok){
      return;
    }

    const used =
      Number(data.usage?.used || 0);

    const remaining =
      Number(data.usage?.remaining ?? 3);

    if(remaining <= 0){

      limitReached = true;

      button.disabled = false;
      button.textContent =
        "오늘 무료 이용 완료";

    }else if(used > 0){

      button.textContent =
        `📄 AI로 이력서 문장 개선하기 · ${remaining}회 남음`;

    }

  }catch(error){
    console.error(error);
  }
}


/* 무료 사용 완료 메시지 */

function showLimit(){

  result.classList.add("show");
  resultContent.style.whiteSpace = "normal";

  resultContent.innerHTML =
    '<div style="text-align:center;padding:14px 5px;">' +
      '<div style="font-size:32px;margin-bottom:8px;">⏰</div>' +
      '<div style="font-size:18px;font-weight:800;margin-bottom:7px;color:#111827;">' +
        '오늘의 무료 AI 이용을 모두 사용했어요' +
      '</div>' +
      '<div style="color:#64748b;font-size:14px;line-height:1.7;">' +
        '무료 AI 기능은 하루 3회까지 이용할 수 있습니다.<br>' +
        '내일 다시 이용해주세요.' +
      '</div>' +
      '<div style="display:inline-block;margin-top:14px;padding:7px 13px;background:#eff6ff;color:#2563eb;border-radius:999px;font-size:13px;font-weight:800;">' +
        '오늘 3 / 3회 사용' +
      '</div>' +
    '</div>';

  result.scrollIntoView({
    behavior:"smooth",
    block:"nearest"
  });
}


/* AI 이력서 분석 */

button.addEventListener(
  "click",
  async function(){

    if(limitReached){
      showLimit();
      return;
    }

    const job =
      document.getElementById("job").value;

    const section =
      document.getElementById("section").value;

    const originalText =
      essay.value.trim();


    if(!job){
      alert("지원 직무를 선택해주세요.");
      return;
    }

    if(!section){
      alert("개선할 이력서 항목을 선택해주세요.");
      return;
    }

    if(originalText.length < 15){
      alert("이력서 문장을 15자 이상 입력해주세요.");
      return;
    }


    button.disabled = true;
    button.textContent =
      "📄 AI가 이력서 문장을 분석하고 있습니다...";

    result.classList.add("show");

    resultContent.style.whiteSpace =
      "pre-wrap";

    resultContent.textContent =
      "이력서 문장을 분석하고 있습니다.\n잠시만 기다려주세요.";


    const requestText =
`[AI 이력서 문장 개선 요청]

이력서 항목:
${section}

사용자가 실제로 작성한 내용:
${originalText}

위 내용을 지원 직무에 맞는 이력서 문장으로 분석하고 개선해주세요.

반드시 다음 원칙을 지켜주세요.

1. 사용자가 입력하지 않은 경력, 경험, 회사명, 직책, 자격증, 성과, 수치 또는 사실을 절대 만들어내지 마세요.
2. 사용자가 제공한 실제 사실의 범위 안에서만 문장을 개선해주세요.
3. 부족한 정보가 있다면 임의로 채우지 말고 어떤 정보를 추가하면 좋은지 질문 또는 제안해주세요.
4. 불필요하게 길거나 반복되는 표현을 찾아주세요.
5. 지원 직무와 관련성이 잘 드러나도록 문장 구조를 개선해주세요.
6. 실제 이력서에 사용할 수 있도록 간결하고 전문적으로 작성해주세요.
7. 과장된 표현이나 확인되지 않은 성과를 추가하지 마세요.
8. 개선 예시는 반드시 사용자가 제공한 사실만 사용해주세요.

다음 형식으로 답변해주세요.

[전체 평가]

[좋은 점]

[개선할 점]

[직무 연관성]

[추가하면 좋은 정보]

[추천 이력서 문장]

[더 간결한 한 줄 버전]`;


    try{

      const response =
        await fetch(API_URL,{
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            job:job,
            essay:requestText
          })
        });


      const data =
        await response.json();


      if(
        response.status === 429 &&
        data.limitReached
      ){

        limitReached = true;

        button.disabled = false;
        button.textContent =
          "오늘 무료 이용 완료";

        showLimit();

        return;
      }


      if(!response.ok || !data.ok){

        throw new Error(
          data.error ||
          "AI 이력서 분석 중 오류가 발생했습니다."
        );
      }


      resultContent.style.whiteSpace =
        "pre-wrap";

      resultContent.textContent =
        data.result;


      const used =
        Number(data.usage?.used || 0);

      const remaining =
        Number(data.usage?.remaining ?? 0);


      const usageBox =
        document.createElement("div");

      usageBox.style.marginTop = "22px";
      usageBox.style.padding = "12px";
      usageBox.style.background = "#eff6ff";
      usageBox.style.color = "#2563eb";
      usageBox.style.borderRadius = "10px";
      usageBox.style.textAlign = "center";
      usageBox.style.fontSize = "13px";
      usageBox.style.fontWeight = "800";
      usageBox.style.whiteSpace = "normal";


      if(remaining > 0){

        usageBox.textContent =
          `오늘 무료 AI 이용 ${used} / 3회 · ${remaining}회 남음`;

        button.disabled = false;

        button.textContent =
          `📄 AI로 이력서 문장 개선하기 · ${remaining}회 남음`;

      }else{

        limitReached = true;

        usageBox.textContent =
          "오늘 무료 AI 이용 3 / 3회 · 무료 이용 완료";

        button.disabled = false;
        button.textContent =
          "오늘 무료 이용 완료";
      }


      resultContent.appendChild(
        usageBox
      );


    }catch(error){

      console.error(error);

      resultContent.style.whiteSpace =
        "pre-wrap";

      resultContent.textContent =
        "AI 이력서 분석 중 문제가 발생했습니다.\n\n" +
        error.message;

      button.disabled = false;
      button.textContent =
        "📄 AI로 이력서 문장 개선하기";
    }


    result.scrollIntoView({
      behavior:"smooth",
      block:"nearest"
    });

  }
);


loadUsage();

</script>

</body>
</html>
